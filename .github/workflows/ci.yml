# ARCHITECTURE §15: Domain and Core on Linux; one macOS job builds the app per pull
# request (macOS minutes cost 10x on private repos).
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers (GRDB builds with the package) and time zones
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libsqlite3-dev tzdata
      - name: Domain and Core tests
        run: swift test --filter 'ClewDomainTests|ClewCoreTests'

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Extension
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Tests (scrapers against saved pages, Gateway client, shared contract)
        run: bun test
      - name: Build the unpacked extension
        run: bun run build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: All package tests
        run: swift test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Clew.xcodeproj -scheme Clew -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- build
      - name: Every UI string is in the String Catalog
        run: python3 -I scripts/sync-strings.py DerivedData --check
